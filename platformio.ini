; Forager — e-ink foraging tamagotchi for ESP32-S3 Super Mini
; PlatformIO project. Open this folder in VSCode with the PlatformIO IDE
; extension installed (see .vscode/extensions.json) and it will configure
; IntelliSense, build, and upload automatically.

[platformio]
default_envs = esp32s3_supermini
src_dir = src

[env:esp32s3_supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 Super Mini: 4MB flash, no PSRAM on most variants.
board_build.flash_mode = qio
board_build.mcu = esp32s3
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; No OTA and no SPIFFS/LittleFS in this project, so a single large app
; partition (no ota_1 slot, minimal spiffs) beats the OTA-oriented default.
board_build.partitions = huge_app.csv

build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial over native USB-C
	; 0, not 3: Serial IS the USB port here, and ESP-IDF's own logging (the WiFi
	; stack especially) goes out through the USB-Serial-JTAG console driver,
	; which blocks once its FIFO fills with no host draining it. On battery
	; there is no host, so the device hung before it ever drew the panel.
	; Raise this to 3 while debugging over USB, but ship at 0.
	-D CORE_DEBUG_LEVEL=0
	; Shared headers live in include/ (auto on the path). These add each
	; module dir so a module's own header resolves with plain #include "net.h".
	-I src/net
	-I src/foraging
	-I src/creature
	-I src/display
	-I src/epd_official
	-I src/events
	-I src/journal
	-I src/minigames
	-I src/textentry
	-I src/wifistore

lib_deps =
	bblanchon/ArduinoJson @ ^7.0.0
	adafruit/Adafruit GFX Library @ ^1.11.0
	adafruit/Adafruit BusIO @ ^1.16.0
